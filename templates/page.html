{% extends "base.html" %}

{% block content %}

<div class="post-page">
    <div class="post-container">

        <a href="{{ config.base_url }}/#blog" class="post-back">
            <i class="fa-solid fa-arrow-right"></i> بازگشت به بلاگ
        </a>

        <h1 class="post-title">{{ page.title }}</h1>

        {% if page.extra.technologies %}
        <div class="post-tech">
            {% for tech in page.extra.technologies %}
            <span>{{ tech }}</span>
            {% endfor %}
        </div>
        {% endif %}

        <div class="post-body">
            {{ page.content | safe }}
        </div>

        {% if page.extra.link %}
        <a class="post-link" href="{{ page.extra.link }}" target="_blank" rel="noopener noreferrer">
            مشاهده روی گیت‌هاب <i class="fa-brands fa-github"></i>
        </a>
        {% endif %}

    </div>
</div>

<style>
    .post-page {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 80px 20px;
        background: #16151a;
    }
    .post-container { max-width: 760px; width: 100%; }
    .post-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #a06fff;
        text-decoration: none;
        margin-bottom: 30px;
        font-size: 0.95rem;
    }
    .post-back:hover { opacity: 0.7; }
    .post-title { color: #fff; font-size: 2.2rem; margin-bottom: 16px; line-height: 1.3; }
    .post-tech { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 30px; }
    .post-tech span {
        background: rgba(160,100,255,0.15);
        border: 1px solid rgba(160,100,255,0.4);
        color: #c9a8ff;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
    }
    .post-body { color: #d8d8de; font-size: 1.05rem; line-height: 2; }
    .post-body h2 { color: #fff; margin-top: 40px; margin-bottom: 16px; font-size: 1.4rem; }
    .post-body p { margin-bottom: 20px; }
    .post-body blockquote {
        border-right: 3px solid #a06fff;
        padding-right: 16px;
        margin: 24px 0;
        color: #b8a8d8;
        font-style: italic;
    }
    .post-body pre {
        background: #0f0e12;
        border-radius: 8px;
        padding: 16px;
        overflow-x: auto;
        direction: ltr;
        text-align: left;
    }
    .post-body ul { padding-right: 20px; margin-bottom: 20px; }
    .post-body img { border-radius: 8px; }
    .post-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 30px;
        color: #a06fff;
        text-decoration: none;
        border: 1px solid rgba(160,100,255,0.4);
        padding: 10px 20px;
        border-radius: 8px;
    }
    .post-link:hover { background: rgba(160,100,255,0.1); }
</style>

{% endblock content %}
